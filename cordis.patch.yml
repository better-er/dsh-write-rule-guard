# dsh-write-rule-guard bundle patch：把本插件插进 profile 的 layer stack。
# profile 引用本 bundle 或 dev_install_package 时自动挂载，全局生效。
# 本 entry 的 config 即安装后的默认值；enabled / joiner / rules / extraTools 都可在 cordis 配置文件里直接对照修改，
# 见 README「配置」。默认规则匹配全角圆括号，message 支持 {file}、{count}、{lines}、{pattern} 占位符。
# extraTools 默认拦截 dsh-remote-file-system 的 edit_remote 与 write_remote；给空数组则只拦内置的 edit / write。
- insert:
    - id: dsh-write-rule-guard
      name: 'dsh-write-rule-guard'
      config:
        enabled: true
        joiner: ' '
        pwshMessage: 'あー！差点就让你混过去了！偷偷用 pwsh 绕过可不行哦！改对了再来吧！'
        extraTools:
          - name: edit_remote
            contentKey: new_string
          - name: write_remote
            contentKey: content
        rules:
          - enabled: true
            pattern: '[\uFF08\uFF09]'
            message: 本次写入未遵循用户偏好，已被用户拒绝写入。请修改为不使用括号的描述方式。行：{lines}；文件：{file}
